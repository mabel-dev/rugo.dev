name: validate-data

on:
  pull_request:
    paths:
      - "**.jsonl"
      - "contract.json"
      - "tools/check_jsonl.py"

jobs:
  jsonl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install rugo
      - name: Validate every tracked .jsonl file
        run: git ls-files -z '*.jsonl' | xargs -r -0 python tools/check_jsonl.py contract.json
