# SEC-07: OWASP ZAP baseline (passive) scan of https://rugo.dev through the
# fleet's reusable workflow. This file owns only the triggers and the target.
# The scan and the upload of every finding to opteryx.ops.pipeline_scan_findings
# are defined once in mabel-dev/.github. Report only: findings never fail it.
# The site is served by GitHub Pages, which sets the response headers, so
# header findings (CSP, HSTS, frame options) can't be fixed from this repo.
name: DAST Scan

on:
  schedule:
    # Same minute as security_scan.yaml (sha256 of the repo name mod 60), an hour later.
    - cron: '56 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dast-scan:
    permissions:
      contents: read
      id-token: write  # OIDC to authenticate.opteryx for the upload; no stored secret
    uses: mabel-dev/.github/.github/workflows/dast_scan.yaml@main
    with:
      url: https://rugo.dev
